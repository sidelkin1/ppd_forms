{% macro table_row(task, job, report_title, success_text, danger_text) -%}
    <tr>
        <td class="text-center">{{ report_title.get(task.name, task.name) }}</td>
        <td class="text-center">{{ job.created_at.strftime("%d.%m.%Y %H:%M") }}</td>
        <td>
            {{ caller(task) }}
        </td>
        <td class="text-center">
            <div class="d-flex align-items-center justify-content-center gap-2">
                <div class="spinner-border spinner-border-sm" id="{{ job.job_id }}Fetch" role="status"></div>
                <button
                    type="button"
                    id="{{ job.job_id }}CancelButton"
                    class="btn btn-danger d-none"
                >
                    <i class="bi bi-x-circle"></i> Отменить
                </button>
            </div>
            <div class="alert alert-success d-none" id="{{ job.job_id }}Success" role="alert">
                <i class="bi bi-check-circle-fill"></i> {{ success_text }}
                <a href="#" class="alert-link" id="{{ job.job_id }}Link"><i class="bi bi-download"></i> Скачать</a>
            </div>
            <div class="alert alert-warning d-none" id="{{ job.job_id }}Warning" role="alert">
                <i class="bi bi-slash-circle-fill"></i> <span class="alert-msg" data-default-text="Задача отменена пользователем">Задача отменена пользователем</span>
            </div>
            <div class="alert alert-danger d-none" id="{{ job.job_id }}Danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span class="alert-msg" data-default-text="{{ danger_text }}">{{ danger_text }}</span>
            </div>
        </td>
    </tr>
{%- endmacro %}
