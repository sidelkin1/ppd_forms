{% macro accordion_form(item, title, success_text, danger_text, need_link=False) -%}
    <div class="accordion" id="{{ item.path }}Accordion">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button
                    class="accordion-button collapsed"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#{{ item.path }}Collapse"
                >
                    {{ title }}
                </button>
            </h2>
            <div
                id="{{ item.path }}Collapse"
                class="accordion-collapse collapse"
                data-bs-parent="#{{ item.path }}Accordion"
            >
                <div class="accordion-body">
                    {{ caller(item) }}
                    <div class="alert alert-success d-none" id="{{ item.path }}Success" role="alert">
                        <i class="bi bi-check-circle-fill"></i> {{ success_text }}
                        {% if need_link %}
                            <a href="#" class="alert-link" id="{{ item.path }}Link"><i class="bi bi-download"></i> Скачать</a>
                        {% endif %}
                    </div>
                    <div class="alert alert-warning d-none" id="{{ item.path }}Warning" role="alert">
                        <i class="bi bi-slash-circle-fill"></i> <span class="alert-msg" data-default-text="Задача отменена пользователем">Задача отменена пользователем</span>
                    </div>
                    <div class="alert alert-danger d-none" id="{{ item.path }}Danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span class="alert-msg" data-default-text="{{ danger_text }}">{{ danger_text }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
{%- endmacro %}
