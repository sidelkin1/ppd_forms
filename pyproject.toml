[project]
name = "ppd-forms"
version = "0.1.0"
description = "Приложение для создания типовых отчетов ППД"
authors = [{ name = "sidelkin", email = "sidelkin@yandex.ru" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dateutil>=2.8.2,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.28.0,<0.29.0",
    "arq>=0.26.0,<0.27.0",
    "pydantic>=2.6.2,<2.7.0",
    "pydantic-settings>=2.0.3,<3.0.0",
    "fastapi>=0.103.1,<0.104.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "ldap3>=2.9.1,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "aiocsv>=1.2.4,<2.0.0",
    "aiofiles>=23.2.1,<24.0.0",
    "pandas>=2.2.0,<3.0.0",
    "oracledb>=1.4.1,<2.0.0",
    "structlog>=24.1.0,<25.0.0",
    "rich>=13.7.1,<14.0.0",
    "colorama>=0.4.6,<0.5.0",
    "fastapi-pagination>=0.12.27,<0.13.0",
    "openpyxl>=3.1.5,<4.0.0",
    "python-calamine>=0.3.1,<0.4.0",
]

[dependency-groups]
web = [
    "websockets>=11.0.3,<12.0.0",
    "uvicorn[standard]>=0.23.2,<0.24.0",
    "jinja2>=3.1.2,<4.0.0",
    "python-multipart>=0.0.7,<0.0.12",
    "alembic>=1.12.0,<1.14.0",
]

worker = [
    "pyarrow>=15.0.0,<16.0.0",
    "tenacity>=8.2.3,<9.0.0",
    "aioshutil>=1.3,<2.0",
    "scipy>=1.13.1,<2.0.0",
    "pillow>=11.1.0,<12.0.0",
    "xlsxwriter>=3.2.9,<4.0.0",
]

dev = [
    "taskipy>=1.12.0,<2.0.0",
    "absolufy-imports>=0.3.1,<0.4.0",
    "pre-commit>=3.4.0,<4.0.0",
    "mypy>=1.6.1,<2.0.0",
    "pytest>=7.4.3,<8.0.0",
    "httpx>=0.26.0,<0.27.0",
    "testcontainers[postgresql]>=3.7.1,<4.0.0",
    "coverage[toml]>=7.4.0,<8.0.0",
    "csv-diff>=1.1,<2.0",
    "pytest-asyncio>=0.23.3,<0.24.0",
    "types-aiofiles>=23.2.0.20240106,<24.0.0",
    "types-python-dateutil>=2.8.19.20240106,<3.0.0",
    "pandas-stubs>=2.1.4.231227,<3.0.0",
    "types-pyyaml>=6.0.12.12,<7.0.0",
    "types-python-jose>=3.3.4.20240106,<4.0.0",
    "types-ldap3>=2.9.13.20240119,<3.0.0",
    "types-colorama>=0.4.15.20240311,<0.5.0",
    "types-openpyxl>=3.1.0.20240428,<4.0.0",
    "types-redis>=4.6.0.20240726,<5.0.0",
    "types-pillow>=10.2.0.20240822,<11.0.0",
    "ruff>=0.16.2,<0.17.0",
]

docs = [
    "mkdocs-material>=9.7.6,<10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev", "web", "worker"]

constraint-dependencies = [
    "redis<5",
    "hiredis<3",
    "pyasn1<0.6",
]

[tool.taskipy.tasks]
makemigrations = 'alembic revision --autogenerate -m "First migration"'
migrate = "alembic upgrade head"
initialize = "python -m app.initial_data"
uvicorn = "uvicorn app.main:app --port 8000 --host 0"
worker = "arq app.worker.WorkerSettings"
ofm-pre-start = "python -m app.ofm_pre_start"

[tool.coverage.run]
omit = [
    ".*",
    "tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 79
exclude = ["app/infrastructure/db/migrations/versions/*"]

[tool.ruff.lint]
ignore = ["RUF012", "PLC0105", "DTZ011", "DTZ901", "E203"]
extend-select = ["E501", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/migrations/versions/*" = ["N999"]
"tests/**" = ["DTZ001", "DTZ005", "ASYNC230", "SIM115"]

[tool.mypy]
exclude = ["/Scripts/"]

[[tool.mypy.overrides]]
module = "app.infrastructure.db.migrations.versions.*"
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = [
    "app.infrastructure.db.dao.sql.querysets.*",
    "app.infrastructure.db.dao.sql.ofm.querysets.*",
    "app.infrastructure.db.dao.sql.reporters.querysets.*",
    "app.infrastructure.db.dao.local.main_table",
    "app.infrastructure.db.dao.local.regex_replace",
    "app.infrastructure.db.models.local.base",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "app.core.services.entrypoints.db",
    "app.infrastructure.holder",
    "app.infrastructure.redis.dao.arq",
]
disable_error_code = ["union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "app.infrastructure.provider",
    "app.infrastructure.db.models.local.inj_well_database",
    "app.infrastructure.db.models.local.monthly_report",
    "app.infrastructure.db.models.local.neighborhood",
    "app.infrastructure.db.models.local.new_strategy_inj",
    "app.infrastructure.db.models.local.new_strategy_oil",
    "app.infrastructure.db.models.local.well_profile",
    "app.infrastructure.db.models.local.well_test",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "csv_diff.*"]
ignore_missing_imports = true
